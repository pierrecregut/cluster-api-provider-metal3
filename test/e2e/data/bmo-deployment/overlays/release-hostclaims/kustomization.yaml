kind: Kustomization
namespace: baremetal-operator-system
resources:
- https://github.com/metal3-io/baremetal-operator/config/overlays/basic-auth_tls?ref=main
patches:
- patch: |
    # Don't try to pull again the pre-loaded image
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
  target:
    kind: Deployment
    name: controller-manager
images:
- name: quay.io/metal3-io/baremetal-operator
  newName: registry.gitlab.com/orange-opensource/kanod/cluster-api-provider-metal3
  newTag: v0.13.0-hosts.8
# We cannot use suffix hashes since the kustomizations we build on
# cannot be aware of what suffixes we add.
generatorOptions:
  disableNameSuffixHash: true
# NOTE: These credentials are generated automatically in scripts/ci-e2e.sh
secretGenerator:
- name: ironic-credentials
  files:
  - username=ironic-username
  - password=ironic-password

